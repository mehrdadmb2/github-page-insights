openapi: 3.1.0
info:
  title: Universal Event Insights API
  version: 1.0.0
  description: Universal request-driven telemetry API. Use GET /v1/schema for the live contract.
servers:
  - url: https://github-page-insights-worker.game-developer-mb.workers.dev
paths:
  /v1/platforms:
    get:
      summary: List discovered platforms
      operationId: listPlatforms
      responses:
        '200':
          description: Platform list
  /v1/overview:
    get:
      summary: Global analytics overview
      operationId: getOverview
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Overview data
  /v1/platforms/{platformId}:
    get:
      summary: Get platform analytics
      operationId: getPlatform
      parameters:
        - $ref: '#/components/parameters/PlatformId'
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Platform analytics
  /v1/platforms/{platformId}/events:
    get:
      summary: Get recent platform events
      operationId: getPlatformEvents
      parameters:
        - $ref: '#/components/parameters/PlatformId'
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Event list
  /v1/platforms/{platformId}/visitors:
    get:
      summary: Get platform visitors
      operationId: getPlatformVisitors
      parameters:
        - $ref: '#/components/parameters/PlatformId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Visitor list
  /v1/platforms/{platformId}/sessions:
    get:
      summary: Get platform sessions
      operationId: getPlatformSessions
      parameters:
        - $ref: '#/components/parameters/PlatformId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Session list
  /v1/events:
    post:
      summary: Create a telemetry event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event created in D1
        '202':
          description: Event accepted with degraded aggregate processing
        '200':
          description: Duplicate eventId; event not inserted twice
        '400':
          description: Invalid request
        '413':
          description: Payload too large
        '500':
          description: D1 storage failed
    get:
      summary: Get recent events globally or for one platform
      operationId: getEvents
      parameters:
        - name: platform
          in: query
          schema: { type: string }
        - name: site
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Event list
  /v1/stats:
    get:
      summary: Compatibility statistics endpoint
      operationId: getStats
      parameters:
        - name: platform
          in: query
          schema: { type: string }
        - name: site
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Statistics
  /v1/schema:
    get:
      summary: Get live machine-readable contract
      operationId: getSchema
      responses:
        '200':
          description: Live API contract
  /v1/health:
    get:
      summary: Service health
      operationId: getHealth
      parameters:
        - name: probe
          in: query
          schema:
            type: string
            enum: [github]
      responses:
        '200':
          description: Healthy/degraded response
        '503':
          description: Required dependency failure
  /v1/admin/events:
    get:
      summary: Administrative event list
      security:
        - AdminKey: []
      responses:
        '200': { description: Event list }
        '401': { description: Unauthorized }
  /v1/admin/event:
    get:
      summary: Full administrative event detail
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Full event row }
        '401': { description: Unauthorized }
        '404': { description: Event not found }
  /v1/admin/notifications:
    get:
      summary: Notification log
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Notification list }
  /v1/admin/archive-retry/{eventId}:
    post:
      summary: Retry GitHub archive for an event
      security:
        - AdminKey: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Retry result }
        '202': { description: Retry scheduled }
        '401': { description: Unauthorized }
  /v1/admin/platform-key:
    post:
      summary: Set or replace a platform API key hash
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformKeyInput'
      responses:
        '200': { description: Platform key configured }
        '401': { description: Unauthorized }
  /telegram/setup:
    get:
      summary: Configure Telegram webhook
      security:
        - AdminKey: []
      responses:
        '200': { description: Webhook configured }
        '401': { description: Unauthorized }
  /telegram/test:
    get:
      summary: Send a Telegram integration test
      security:
        - AdminKey: []
      responses:
        '200': { description: Test sent }
        '401': { description: Unauthorized }
  /telegram/webhook:
    post:
      summary: Receive Telegram webhook updates
      responses:
        '200': { description: Update accepted }
components:
  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
  parameters:
    PlatformId:
      name: platformId
      in: path
      required: true
      schema: { type: string }
    Days:
      name: days
      in: query
      schema:
        oneOf:
          - { type: integer, minimum: 1, maximum: 3650 }
          - { type: string, enum: [all] }
      example: 7
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
      example: 100
  schemas:
    EventInput:
      type: object
      required: [platformId]
      properties:
        platformId: { type: string, minLength: 1, maxLength: 96 }
        platformName: { type: string }
        platformType: { type: string }
        platformUrl: { type: string, format: uri }
        platformDomain: { type: string }
        environment: { type: string }
        appVersion: { type: string }
        sdkName: { type: string }
        sdkVersion: { type: string }
        source: { type: string }
        eventType: { type: string }
        eventId: { type: string }
        timestamp: { type: string, format: date-time }
        identity:
          type: object
          properties:
            userId: { type: string }
            visitorId: { type: string }
            anonymousId: { type: string }
            sessionId: { type: string }
        page:
          type: object
          properties:
            url: { type: string, format: uri }
            path: { type: string }
            title: { type: string }
            referrer: { type: string, format: uri }
        screen:
          type: object
          properties:
            width: { type: integer }
            height: { type: integer }
            devicePixelRatio: { type: number }
            colorDepth: { type: integer }
        viewport:
          type: object
          properties:
            width: { type: integer }
            height: { type: integer }
        connection:
          type: object
          properties:
            effectiveType: { type: string }
            downlink: { type: number }
            rtt: { type: integer }
            saveData: { type: boolean }
        platformIp: { type: string }
        data: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
      additionalProperties: true
    PlatformKeyInput:
      type: object
      required: [platformId, apiKey]
      properties:
        platformId: { type: string }
        platformName: { type: string }
        platformType: { type: string }
        apiKey: { type: string }
